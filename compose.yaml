services:
  backend:
    build:
      context: ./backend
    container_name: bizsc-backend
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
    command:
      - python
      - -Xfrozen_modules=off
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - --wait-for-client
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      
  frontend:
    build:
      context: ./frontend
    container_name: bizsc-frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:17
    container_name: bizsc-db
    environment:
      POSTGRES_DB: bizsc
      POSTGRES_USER: bizsc
      POSTGRES_PASSWORD: bizsc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
